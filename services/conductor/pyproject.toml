# conductor = BrewAI 유일한 자체 코어 (ADR-0001). 루트 uv 워크스페이스 멤버, lock 은 루트 uv.lock 하나.
# 정확한 버전만 · 게시 7일 지난 것만 (루트 exclude-newer). Pydantic AI 는 agent.py 한 파일에서만 import (ADR-0002).
[project]
name = "conductor"
version = "0.0.0"
requires-python = "==3.13.*"
dependencies = [
    "pydantic-ai-slim[ag-ui]==2.59.0",        # 2026-10-21 · ag-ui = AG-UI SSE
    "openai==3.36.0",                         # 2026-10-21 · LiteLLMProvider 가 쓰는 OpenAI SDK ([openai] extra 의 tiktoken 은 채팅에 안 씀)
    "fastapi==0.159.1",                       # 2026-10-21
    "uvicorn==0.54.0",                        # 2026-09-25 · [standard] 아님 (uvloop 은 윈도우 미지원)
    "httpx2==2.16.0",                         # 2026-10-21 · pydantic-ai·openai 가 이미 쓰는 HTTP 클라이언트 (게이트웨이 카탈로그 · Google code 교환)
    "argon2-cffi==25.1.0",                    # 2025-06-03 · 비밀번호 argon2id (ADR-0010) · 전이 bindings 26.1.0 · cffi 2.1.1 · pycparser 3.11 (모두 exclude-newer 안)
    "mcp==2.3.0",                             # 2026-10-02 · 공식 MCP SDK 클라이언트 (Streamable HTTP 만 · ADR-0013) · 연결 코드 = connectors/ 만
    "cryptography==50.0.2",                   # 2026-09-30 · MCP 인증정보 AES-GCM (connectors/vault.py · ADR-0013) · 직접 고정
    "pypdf==6.21.2",                          # 2026-10-21 · PDF 글 뽑기 (files.py · ADR-0015) · 순수 파이썬 · 필수 전이 의존성 없음
]

[build-system]
# uv 0.13.x 는 이 범위면 내장 백엔드를 쓴다 (내려받지 않음). uv_build 0.13.5 는 2026-10-22 게시 = exclude-newer 밖
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
