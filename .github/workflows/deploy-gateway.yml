# 게이트웨이 서버(Oracle 무료 VM)에 배포한다 (ADR-0014). develop 에 infra/deploy · infra/litellm 가 바뀌면 + 손으로(Run workflow · Re-run).
# GitHub 에는 SSH 접속 정보 4개만: DEPLOY_HOST · DEPLOY_USER · DEPLOY_SSH_KEY · DEPLOY_KNOWN_HOSTS.
# 배포 키 = 서버 root(sudo) → Environment 'gateway' 의 시크릿으로만 두고, 그 Environment 는 develop 브랜치만 허용 (README 6단계).
# 게이트웨이 비밀값(master key · salt · DB 비번)은 서버 /opt/brewai/.env 에만 있다 (bootstrap.sh 가 만듦).
# 시크릿이 없으면 배포를 건너뛰고 초록으로 끝난다. 서드파티 액션 없음 (ssh · rsync · curl) · checkout 은 전체 커밋 SHA 로 고정.
name: deploy-gateway

on:
  push:
    branches: [develop]
    paths:
      - infra/deploy/**
      - infra/litellm/**
      - .github/workflows/deploy-gateway.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gateway
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: gateway
    timeout-minutes: 20
    defaults:
      run:
        shell: bash   # = bash -eo pipefail: deploy.sh 실패가 tee 뒤에 묻히지 않게
    env:
      CONFIGURED: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' && secrets.DEPLOY_SSH_KEY != '' && secrets.DEPLOY_KNOWN_HOSTS != '' }}
    steps:
      - name: 시크릿 없음 → 건너뜀
        if: env.CONFIGURED != 'true'
        run: echo "::notice::DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS 가 없어 배포를 건너뛰어요 (README '게이트웨이 서버')"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        if: env.CONFIGURED == 'true'
        with:
          persist-credentials: false

      - name: SSH 준비 (known_hosts 고정 · 처음 보는 호스트 키는 거부)
        if: env.CONFIGURED == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.:-]+$ ]] || { echo "::error::DEPLOY_HOST 모양이 이상해요"; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "::error::DEPLOY_USER 모양이 이상해요"; exit 1; }
          install -m 700 -d ~/.ssh
          (umask 077; printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key; printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts_deploy)
          cat > ~/.ssh/config <<EOF
          Host gateway
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            UserKnownHostsFile ~/.ssh/known_hosts_deploy
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 15
          EOF
          chmod 600 ~/.ssh/config
          ssh gateway true

      - name: 파일 복사 (infra/deploy + infra/litellm/config.yaml → ~/brewai-staging)
        if: env.CONFIGURED == 'true'
        run: |
          ssh gateway 'rm -rf brewai-staging && mkdir -p brewai-staging'
          rsync -rltR --chmod=Du=rwx,Dgo=,Fu=rw,Fgo= ./infra/deploy/ ./infra/litellm/config.yaml gateway:brewai-staging/

      - name: 배포 (sudo deploy.sh → compose pull · up -d --wait)
        id: deploy
        if: env.CONFIGURED == 'true'
        run: |
          ssh gateway 'sudo bash brewai-staging/infra/deploy/deploy.sh' | tee deploy.log
          domain="$(sed -n 's/^BREWAI_DOMAIN=//p' deploy.log | tail -n 1)"
          [[ "$domain" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::deploy.sh 가 도메인을 알려 주지 않았어요"; exit 1; }
          echo "domain=$domain" >> "$GITHUB_OUTPUT"

      - name: https 확인 + 공개 범위 확인
        if: env.CONFIGURED == 'true'
        env:
          DOMAIN: ${{ steps.deploy.outputs.domain }}
        run: |
          base="https://$DOMAIN"
          # 첫 배포는 Let's Encrypt 인증서 발급을 기다린다
          curl -fsS --retry 40 --retry-delay 5 --retry-all-errors --max-time 10 "$base/health/liveliness" > /dev/null
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$@"; }
          fail=0
          expect() { local want="$1" got; shift; got="$(code "$@")"; echo "$got ${*: -1}"; [ "$got" = "$want" ] || { echo "::error::${*: -1} = $got (기대 $want)"; fail=1; }; }
          expect 401 "$base/model_group/info"        # 공개 경로도 master key 없으면 401
          expect 404 "$base/openapi.json"            # 문서 · 메트릭은 아무에게도
          expect 404 "$base/metrics"
          expect 404 "$base/key/list"                # 관리 API 는 게이트 쿠키 없으면 404
          expect 303 "$base/ui/"                     # 관리 화면 → /brewai-admin (basic auth)
          expect 401 "$base/brewai-admin"
          if curl -s -D - -o /dev/null --max-time 10 "$base/brewai-admin" | grep -qi '^set-cookie'; then
            echo "::error::인증 없이 게이트 쿠키가 나왔어요"; fail=1
          fi
          [ "$fail" = 0 ]
          echo "::notice::게이트웨이 $base 정상 (PC .env LLM_GATEWAY_URL=$base)"

      - name: SSH 키 지우기
        if: always() && env.CONFIGURED == 'true'
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts_deploy ~/.ssh/config
