# P0-2 더미 eval. P1 골든 1 · 제약 2 도 이 job 이 돈다. 빨강이면 merge 금지 (AGENTS.md).
# 키 없이 돈다: secrets 를 쓰지 않는다 (TestModel · gateway mock).
# 액션은 전체 커밋 SHA 로 고정. 올릴 때는 게시 7일 지난 릴리스만 (4주 cool-down).
name: eval

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1 (2026-10-21)
        with:
          version: "0.13.5" # 2026-10-22 · pyproject required-version 과 맞춘다
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f" # uv-x86_64-unknown-linux-gnu.tar.gz 0.13.5 (v10.3.1 엔 내장 체크섬 없음)
          enable-cache: false # 의존성 몇 개 → 캐시 이득보다 캐시 오염 위험이 크다

      - name: install (uv.lock 그대로, 해시 검증)
        run: uv sync --locked

      - name: eval
        run: uv run --locked pytest evals

      - name: conductor 단위 테스트 (네트워크·키 없음 · FunctionModel/TestModel · LiteLLM 계약 fixture)
        run: uv run --locked pytest services/conductor/tests
