# BrewAI public LLM gateway (ADR-0014): LiteLLM + its Postgres + Caddy (automatic https).
# Server: Oracle Always Free Ampere A1 (linux/arm64), Ubuntu 24.04. Every image = multi-arch index (amd64 + arm64).
# Run on the server through infra/deploy/deploy.sh (GitHub Actions deploy-gateway.yml), never by hand with a repo .env:
#   docker compose -p brewai-gateway --env-file /opt/brewai/.env -f /opt/brewai/app/infra/deploy/compose.yaml ...
# Secrets live only in /opt/brewai/.env (root 600, made by bootstrap.sh). Not in GitHub, not on the PCs except the master key.
# Rules (same as infra/compose.yaml): image tag@sha256 published >= 7 days before pin date 2026-11-01, LITELLM_LICENSE never set,
#   LiteLLM callbacks off (ADR-0003), LITELLM_SALT_KEY never changes once set.
# Only Caddy is published (80/443). LiteLLM and Postgres stay on the internal network.
name: brewai-gateway

services:
  caddy:
    image: docker.io/library/caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    mem_limit: 128m
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      litellm: { condition: service_healthy }
    ports:
      - ${BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-80}:80
      - ${BIND_ADDR:-0.0.0.0}:${HTTPS_PORT:-443}:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificates (keep: re-issuing on every restart hits Let's Encrypt limits)
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?run bootstrap.sh}
      ADMIN_UI_USER: ${ADMIN_UI_USER:?run bootstrap.sh}
      # bcrypt hash; keep it single-quoted in the .env file (it contains $).
      ADMIN_UI_PASSWORD_HASH: ${ADMIN_UI_PASSWORD_HASH:?run bootstrap.sh}
      ADMIN_GATE_TOKEN: ${ADMIN_GATE_TOKEN:?run bootstrap.sh}
      # Test only (local verification): local_certs. Empty on the server = Let's Encrypt.
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}

  litellm:
    image: ghcr.io/berriai/litellm-non_root:v1.106.2@sha256:07fabea33dfc2b127e865c03112dfc76936334b29028ec05cdd355af2385dc04
    mem_limit: 1g
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    read_only: true
    tmpfs: ["/tmp", "/app/.cache", "/nonexistent"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      litellm-db: { condition: service_healthy }
    volumes:
      # The same file as the local stack (mounted, not forked). Keyless mock + callbacks off.
      - ../litellm/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?run bootstrap.sh}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:?run bootstrap.sh}@litellm-db:5432/litellm
      STORE_MODEL_IN_DB: "True"
      # Encrypts provider keys saved in the DB. NEVER change it (new server = same value with a pg_dump restore, or re-register models).
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?run bootstrap.sh}
      PROXY_BASE_URL: https://${DOMAIN:?run bootstrap.sh}
      LITELLM_LOCAL_MODEL_COST_MAP: "True"   # no remote fetches at startup (same 5 flags as infra/compose.yaml)
      LITELLM_LOCAL_BLOG_POSTS: "True"
      LITELLM_LOCAL_POLICY_TEMPLATES: "True"
      LITELLM_LOCAL_ANTHROPIC_BETA_HEADERS: "True"
      LITELLM_LOCAL_AUTOROUTER_PRESETS: "True"
      PYTHON_DOTENV_DISABLED: "1"
      # LITELLM_LICENSE: never (GHSA-w4c7 until 1.106.5). deploy.sh refuses an .env that has it.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s

  litellm-db:
    image: docker.io/library/postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
    mem_limit: 256m
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?run bootstrap.sh}
      POSTGRES_DB: litellm
      TZ: UTC
      PGTZ: UTC
    volumes:
      - litellm_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U litellm -d litellm"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 1s

volumes:
  litellm_db_data:
  caddy_data:
  caddy_config:
