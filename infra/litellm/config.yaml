# BrewAI LiteLLM proxy 1.106.2. ASCII only (Windows cp949).
# Docker stack = DB mode: the mock below + models added in the Admin UI (/ui), both in /model_group/info (ADR-0009).
# venv gateway (npm run gateway) = config-only, the mock only. BrewAI decides exposure, label and order, never price or context.
# Secrets come from the environment via os.environ/... ; never write a key in this file.
model_list:
  # Keyless mock: answers without any provider key (dev, Friday demo without keys).
  - model_name: brewai-mock
    litellm_params:
      model: openai/brewai-mock
      mock_response: "Hello from the BrewAI mock model."
    model_info:
      mode: chat
      max_input_tokens: 128000
      max_output_tokens: 8192
      input_cost_per_token: 0
      output_cost_per_token: 0
  # Real models (Anthropic, OpenAI, ...) are added in the LiteLLM Admin UI (/ui) with their credentials, not here.

litellm_settings:
  # ADR-0003: the conductor owns the trace; no gateway logging callbacks.
  callbacks: []
  success_callback: []
  failure_callback: []

router_settings:
  # Show the real upstream error instead of 429 all_deployments_in_cooldown.
  disable_cooldowns: true
  # Fail fast on a missing or bad provider key (default retries take about 4s).
  num_retries: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
